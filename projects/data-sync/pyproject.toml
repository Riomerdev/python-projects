[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "data-sync"
version = "1.0.0"
description = "ETL incremental con checkpoint, SQLite y reintentos"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
data-sync = "data_sync.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
