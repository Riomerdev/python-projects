[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "policy-search"
version = "1.0.0"
description = "Búsqueda local de políticas con citas verificables"
requires-python = ">=3.12"

[project.scripts]
policy-search = "policy_search.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
