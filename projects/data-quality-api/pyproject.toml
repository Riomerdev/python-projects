[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-api-riomerdev"
version = "1.0.0"
description = "Auditable CSV ingestion API with row-level validation and PostgreSQL"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]>=0.40,<1",
  "SQLAlchemy==2.1.9",
  "psycopg[binary]==3.3.9",
  "alembic==1.20.1",
  "python-multipart>=0.0.20,<1",
]

[project.scripts]
data-quality-api = "data_quality_api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
