[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sla-monitor"
version = "1.0.0"
description = "Monitor asíncrono de disponibilidad y latencia con historial"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "uvicorn[standard]>=0.30,<1"]

[tool.setuptools.packages.find]
where = ["src"]
