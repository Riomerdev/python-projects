[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-sentinel"
version = "1.0.0"
description = "Pipeline de validación, cuarentena y reporte para importaciones CSV"
requires-python = ">=3.12"

[project.scripts]
csv-sentinel = "csv_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
