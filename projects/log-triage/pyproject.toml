[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "log-triage"
version = "1.0.0"
description = "Agregación reproducible de incidentes a partir de logs JSONL"
requires-python = ">=3.12"

[project.scripts]
log-triage = "log_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
